# ---------------------------------------------------------------------------
# InfyGo - default profile (MySQL). Credentials come from environment variables;
# no secrets are stored in this file. See .env.example and README.md.
# ---------------------------------------------------------------------------
spring.application.name=infygo

# Mandatory: context path /InfyGo, configurable port (supports PORT injected by cloud PaaS or SERVER_PORT)
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/InfyGo
server.error.include-stacktrace=never
server.error.include-message=never

# Mandatory: schema "infygo" (supports both DB_* and standard SPRING_DATASOURCE_* env vars)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/infygo?serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:infygo_app}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# Schema is created by Flyway (src/main/resources/db/migration); Hibernate only validates the mapping.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# Keep the prescribed table names (User_Details, Flight_Details, ...) exactly as written.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Mandatory: ValidationMessages.properties also serves the business-error messages.
spring.messages.basename=ValidationMessages
spring.messages.fallback-to-system-locale=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html

# Application settings
infygo.time-zone=Asia/Kolkata
infygo.pnr.min=1000000
infygo.pnr.max=9999999
infygo.pnr.max-attempts=10
infygo.seed.enabled=${INFYGO_SEED_DEMO_DATA:true}
infygo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://saqibahmadbhat.github.io,http://localhost:5173,http://localhost:3000}
