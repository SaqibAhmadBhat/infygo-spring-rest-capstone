services:
  - type: web
    name: infygo-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /InfyGo/actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: INFYGO_SEED_DEMO_DATA
        value: "true"
