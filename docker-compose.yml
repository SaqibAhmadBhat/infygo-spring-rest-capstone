# Local MySQL 8 for InfyGo. Usage: cp .env.example .env && docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: infygo-mysql
    environment:
      MYSQL_DATABASE: infygo
      MYSQL_USER: ${DB_USERNAME:-infygo_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - infygo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

volumes:
  infygo-mysql-data:
