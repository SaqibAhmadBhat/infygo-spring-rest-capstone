# InfyGo validation and error messages (mandatory file per the problem statement).
# Bean Validation uses these keys through {key}; business errors are resolved by GlobalExceptionHandler.

# ---- Registration ----
user.userId.required=User id is required.
user.userId.invalid=User id must be 3-30 characters: letters, digits, dot, underscore or hyphen.
user.name.required=Name is required.
user.name.invalid=Name must start with a letter and contain only letters, spaces, dots, apostrophes or hyphens (2-60 characters).
user.city.required=City is required.
user.city.invalid=City must contain only letters, spaces, dots, apostrophes or hyphens (2-50 characters).
user.email.required=Email is required.
user.email.invalid=Email must be a valid address such as name@example.com.
user.phone.required=Phone number is required.
user.phone.invalid=Phone number must contain 7 to 15 digits, optionally starting with +.
user.password.required=Password is required.
user.password.size=Password must be at least 9 characters long (maximum 64).
user.password.uppercase=Password must contain at least one uppercase letter.
user.password.lowercase=Password must contain at least one lowercase letter.
user.password.special=Password must contain at least one special character.
user.userId.duplicate=This user id is already registered.
user.email.duplicate=This email address is already registered.
user.notFound=No user found with id {0}.

# ---- Login ----
login.userId.required=User id is required.
login.password.required=Password is required.
login.invalidCredentials=Invalid user id or password.

# ---- Flights ----
flight.source.invalid=Source city is missing or invalid.
flight.destination.invalid=Destination city is missing or invalid.
flight.route.sameCity=Source and destination must be different cities.
flight.journeyDate.format=Journey date must be a valid date in yyyy-MM-dd format.
flight.journeyDate.notFuture=Journey date must be a future date (after today).
flight.airline.invalid=Airline filter is invalid.
flight.departureTime.invalid=Departure time filters must use 24-hour HH:mm format.
flight.departureTime.range=departureFrom must not be later than departureTo.
flight.price.invalid=Price filters must be non-negative numbers.
flight.price.range=minPrice must not be greater than maxPrice.
flight.notFound=No flight found with id {0}.

# ---- Booking ----
booking.flightId.invalid=Flight id is missing or invalid.
booking.userId.invalid=User id is missing or invalid.
booking.passengers.required=Passenger list is required.
booking.passengers.size=Between 1 and 10 passengers must be provided.
booking.passenger.null=Passenger details must not be null.
booking.seats.insufficient=Not enough seats available: {0} seat(s) requested on flight {1}.
booking.flight.notBookable=Flight {0} has already departed or departs today and can no longer be booked.
booking.pnr.unavailable=Could not generate a unique PNR. Please retry the booking.
passenger.name.required=Passenger name is required.
passenger.name.invalid=Passenger name must start with a letter and contain only letters, spaces, dots, apostrophes or hyphens (2-60 characters).
passenger.age.required=Passenger age is required.
passenger.age.invalid=Passenger age must be between 0 and 120.
passenger.gender.required=Passenger gender is required.
passenger.gender.invalid=Passenger gender must be Male, Female or Other.
ticket.notFound=No ticket found with PNR {0}.

# ---- Payment (mock) ----
payment.pnr.required=PNR is required.
payment.pnr.invalid=PNR must be a positive number.
payment.cardNumber.required=Card number is required.
payment.cardNumber.invalid=Card number must be exactly 16 alphanumeric characters.
payment.cardHolderName.required=Card holder name is required.
payment.cardHolderName.invalid=Card holder name must start with a letter and contain only letters, spaces, dots, apostrophes or hyphens.
payment.cvv.required=CVV is required.
payment.cvv.invalid=CVV must be exactly 3 digits.
payment.apin.required=ATM PIN is required.
payment.apin.invalid=ATM PIN must be 4 to 6 digits.
payment.expiryMonth.required=Expiry month is required.
payment.expiryMonth.invalid=Expiry month must be the first three letters of a month, e.g. Jan, Feb, Mar.
payment.expiryYear.required=Expiry year is required.
payment.expiryYear.invalid=Expiry year must be a four-digit year.
payment.expiryYear.tooFar=Expiry year is too far in the future.
payment.card.expired=The card has expired.
payment.totalBill.required=Total bill is required.
payment.totalBill.invalid=Total bill must be a positive amount with at most 2 decimal places.
payment.totalBill.mismatch=Total bill does not match the ticket amount of {0}.
payment.alreadyCompleted=Payment has already been completed for PNR {0}.

# ---- Generic request errors ----
request.validationFailed=Request validation failed.
request.matrix.missing=Required matrix parameter {0} is missing.
request.parameter.missing=A required request parameter is missing.
request.parameter.invalid=Request parameter {0} has an invalid value.
request.body.malformed=Request body is missing or is not valid JSON.
request.data.conflict=The request conflicts with existing data.
request.route.notFound=No endpoint exists at this path.
request.search.segment=Unknown flight path {0}. Use /infygo/flights/search;source=..;destination=..;journeyDate=yyyy-MM-dd
request.booking.segment=Unknown booking path {0}. Use /infygo/book/tickets;flightId=..;userId=..
request.method.notAllowed=HTTP method not supported for this endpoint.
request.mediaType.unsupported=Content type not supported. Use application/json.
request.internalError=An unexpected error occurred. Please try again later.
